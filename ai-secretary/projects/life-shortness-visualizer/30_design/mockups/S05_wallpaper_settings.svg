<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932">
  <defs>
    <pattern id="miniDots" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.8" fill="#FFD700" opacity="0.6"/>
    </pattern>
    <pattern id="miniFutureDots" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.8" fill="#0D0D0D" stroke="#3A3A3A" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- iPhone Frame -->
  <rect width="430" height="932" rx="55" fill="#1A1A1A"/>
  <!-- Screen -->
  <rect x="20" y="44" width="390" height="844" rx="47" fill="#0D0D0D"/>

  <!-- Status Bar -->
  <text x="50" y="73" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8E8E8">9:41</text>
  <rect x="355" y="63" width="4" height="10" rx="1" fill="#E8E8E8"/>
  <rect x="361" y="60" width="4" height="13" rx="1" fill="#E8E8E8"/>
  <rect x="367" y="57" width="4" height="16" rx="1" fill="#E8E8E8"/>
  <path d="M379 70 Q383 64 387 70" stroke="#E8E8E8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M376 73 Q383 61 390 73" stroke="#E8E8E8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="383" cy="74" r="1.5" fill="#E8E8E8"/>
  <rect x="396" y="62" width="22" height="12" rx="2" fill="none" stroke="#E8E8E8" stroke-width="1.5"/>
  <rect x="419" y="65" width="2" height="6" rx="1" fill="#E8E8E8"/>
  <rect x="398" y="64" width="16" height="8" rx="1" fill="#E8E8E8"/>

  <!-- Navigation Bar -->
  <rect x="20" y="91" width="390" height="44" fill="#1A1A1A"/>
  <line x1="20" y1="135" x2="410" y2="135" stroke="#2A2A2A" stroke-width="0.75"/>
  <text x="55" y="118" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#FFD700">‹ 設定</text>
  <text x="215" y="118" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#E8E8E8" text-anchor="middle">壁紙の自動更新</text>

  <!-- STATUS CARD -->
  <rect x="30" y="150" width="370" height="78" rx="12" fill="#1C1C1C"/>
  <!-- Green status indicator -->
  <circle cx="55" cy="180" r="6" fill="#4CAF50"/>
  <!-- Pulse ring -->
  <circle cx="55" cy="180" r="10" fill="none" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <text x="72" y="185" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#4CAF50">自動更新: 設定済み</text>
  <text x="55" y="213" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8A8A8">最終更新: 2026年7月28日 月曜日 7:00 AM</text>

  <!-- Section header -->
  <text x="40" y="248" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8A8A8" letter-spacing="0.5">手順を確認する</text>

  <!-- Step 1 -->
  <rect x="30" y="258" width="370" height="60" rx="10" fill="#1C1C1C"/>
  <circle cx="58" cy="288" r="13" fill="#FFD700"/>
  <text x="58" y="293" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D0D0D" text-anchor="middle">1</text>
  <text x="80" y="282" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E8E8">ショートカットアプリを入手</text>
  <text x="80" y="300" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#A8A8A8">App Storeからインストール</text>
  <!-- Checkmark -->
  <circle cx="380" cy="288" r="11" fill="#1E3A1E"/>
  <text x="380" y="293" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#4CAF50" text-anchor="middle">✓</text>

  <!-- Step 2 -->
  <rect x="30" y="326" width="370" height="60" rx="10" fill="#1C1C1C"/>
  <circle cx="58" cy="356" r="13" fill="#FFD700"/>
  <text x="58" y="361" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D0D0D" text-anchor="middle">2</text>
  <text x="80" y="350" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E8E8">オートメーションを作成</text>
  <text x="80" y="368" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#A8A8A8">毎週月曜 7:00 AM に設定</text>
  <circle cx="380" cy="356" r="11" fill="#1E3A1E"/>
  <text x="380" y="361" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#4CAF50" text-anchor="middle">✓</text>

  <!-- Step 3 -->
  <rect x="30" y="394" width="370" height="60" rx="10" fill="#1C1C1C"/>
  <circle cx="58" cy="424" r="13" fill="#FFD700"/>
  <text x="58" y="429" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D0D0D" text-anchor="middle">3</text>
  <text x="80" y="418" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E8E8">Life in Weeks を選択</text>
  <text x="80" y="436" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#A8A8A8">グリッド画像を生成するアクションを追加</text>
  <circle cx="380" cy="424" r="11" fill="#1E3A1E"/>
  <text x="380" y="429" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#4CAF50" text-anchor="middle">✓</text>

  <!-- Step 4 -->
  <rect x="30" y="462" width="370" height="60" rx="10" fill="#1C1C1C"/>
  <circle cx="58" cy="492" r="13" fill="#FFD700"/>
  <text x="58" y="497" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D0D0D" text-anchor="middle">4</text>
  <text x="80" y="486" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8E8E8">壁紙に設定</text>
  <text x="80" y="504" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#A8A8A8">生成された画像をホーム画面に適用</text>
  <circle cx="380" cy="492" r="11" fill="#1E3A1E"/>
  <text x="380" y="497" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#4CAF50" text-anchor="middle">✓</text>

  <!-- Re-setup button (outline style) -->
  <rect x="40" y="540" width="350" height="50" rx="12" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <text x="215" y="571" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFD700" text-anchor="middle">ショートカットを再設定する</text>

  <!-- Wallpaper Preview section -->
  <text x="40" y="612" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8A8A8" letter-spacing="0.5">壁紙プレビュー</text>

  <!-- Preview card -->
  <rect x="30" y="622" width="370" height="130" rx="12" fill="#1C1C1C"/>

  <!-- Mini grid preview inside card -->
  <rect x="50" y="635" width="80" height="104" rx="6" fill="#0D0D0D"/>
  <!-- Mini past dots -->
  <rect x="52" y="637" width="76" height="40" fill="url(#miniDots)"/>
  <!-- Mini future dots -->
  <rect x="52" y="677" width="76" height="60" fill="url(#miniFutureDots)"/>
  <!-- Mini current dot -->
  <circle cx="68" cy="680" r="2.5" fill="#FF3B30"/>

  <!-- Preview text -->
  <text x="145" y="658" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8E8E8">現在のグリッド</text>
  <text x="145" y="678" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8A8A8">27歳 1,404週経過</text>
  <text x="145" y="698" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8A8A8">31.9% 消費</text>

  <!-- Next update info -->
  <line x1="50" y1="720" x2="390" y2="720" stroke="#2A2A2A" stroke-width="0.5"/>
  <text x="215" y="740" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#A8A8A8" text-anchor="middle">次回更新: 2026年8月4日(月) 7:00</text>

  <!-- Home Indicator -->
  <rect x="155" y="898" width="120" height="4" rx="2" fill="#3A3A3A"/>
</svg>
