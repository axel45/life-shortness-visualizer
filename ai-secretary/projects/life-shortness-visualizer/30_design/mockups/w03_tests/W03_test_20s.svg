<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932">
  <defs>
    <pattern id="pg" x="0" y="0" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3" r="2" fill="#555555"/>
    </pattern>
    <pattern id="ps" x="0" y="0" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3" r="2" fill="#C0C0C0"/>
    </pattern>
    <pattern id="pw" x="0" y="0" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3" r="2" fill="#FFFFFF"/>
    </pattern>
    <pattern id="pd" x="0" y="0" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3" r="2" fill="#FFD700"/>
    </pattern>
    <pattern id="pf" x="0" y="0" width="7" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3" r="2" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- フレーム -->
  <rect width="430" height="932" rx="55" fill="#1A1A1A"/>
  <rect x="20" y="44" width="390" height="844" rx="47" fill="#0D0D0D"/>

  <!-- グリッド背景 -->
  <rect x="33" y="255" width="364" height="510" fill="#0D0D0D"/>

  <!-- 過去ゾーン（row 0-24: 150px）-->
  <!-- gray  rows 0-5   → y=255, h=36 -->
  <rect x="33" y="255" width="364" height="36" fill="url(#pg)"/>
  <!-- silver rows 6-11  → y=291, h=36 -->
  <rect x="33" y="291" width="364" height="36" fill="url(#ps)"/>
  <!-- white  rows 12-23 → y=327, h=72 -->
  <rect x="33" y="327" width="364" height="72" fill="url(#pw)"/>
  <!-- gold   row 24     → y=399, h=6 -->
  <rect x="33" y="399" width="364" height="6"  fill="url(#pd)"/>

  <!-- 現在週 row=25, col=26 → y=405
       past  cols 0-25: x=33, w=182
       ring  col 26:    cx=218.5
       future cols 27-51: x=222, w=175 -->
  <rect x="33"  y="405" width="182" height="6" fill="url(#pd)"/>
  <circle cx="218.5" cy="408" r="4"   fill="none" stroke="#FFD700" stroke-width="2"/>
  <circle cx="218.5" cy="408" r="6.5" fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
  <rect x="222" y="405" width="175" height="6" fill="url(#pf)"/>

  <!-- 未来 rows 26-84 → y=411, h=354 -->
  <rect x="33" y="411" width="364" height="354" fill="url(#pf)"/>

  <!-- Dynamic Island -->
  <rect x="168" y="52" width="94" height="34" rx="17" fill="#000000"/>

  <!-- ステータスバー -->
  <text x="50" y="82" font-family="SF Pro Display,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="376" y="71" width="22" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="378" y="73" width="16" height="8" rx="1" fill="#FFFFFF"/>

  <!-- テストラベル -->
  <text x="215" y="130" font-family="SF Pro Display,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#FFD700" text-anchor="middle" opacity="0.7">── テスト: 20代（25歳）──</text>
  <text x="215" y="146" font-family="SF Pro Display,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#8E8E93" text-anchor="middle">row=25 / col=26 / 人生消費率 29.4%</text>

  <!-- 時計（最小サイズ） -->
  <text x="215" y="180" font-family="SF Pro Display,Helvetica Neue,Arial,sans-serif" font-size="50" font-weight="100" fill="#FFFFFF" text-anchor="middle">9:41</text>
  <text x="215" y="200" font-family="SF Pro Display,Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="300" fill="#FFFFFF" text-anchor="middle">8月4日 月曜日</text>

  <!-- グリッド開始ライン（確認用） -->
  <line x1="20" y1="255" x2="410" y2="255" stroke="#FFD700" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- 下部コントロール -->
  <circle cx="100" cy="840" r="28" fill="#FFFFFF" opacity="0.2"/>
  <text x="100" y="848" font-size="20" text-anchor="middle" fill="#FFFFFF">&#x26A1;</text>
  <circle cx="330" cy="840" r="28" fill="#FFFFFF" opacity="0.2"/>
  <text x="330" y="848" font-size="20" text-anchor="middle" fill="#FFFFFF">&#x2299;</text>

  <!-- ホームインジケーター -->
  <rect x="175" y="898" width="120" height="4" rx="2" fill="#FFFFFF" opacity="0.5"/>
</svg>
