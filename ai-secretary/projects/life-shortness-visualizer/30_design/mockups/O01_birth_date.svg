<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932">

  <!-- iPhone Frame -->
  <rect width="430" height="932" rx="55" fill="#1A1A1A"/>
  <!-- Screen -->
  <rect x="20" y="44" width="390" height="844" rx="47" fill="#0D0D0D"/>

  <!-- Status Bar -->
  <text x="50" y="73" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8E8E8">9:41</text>
  <rect x="355" y="63" width="4" height="10" rx="1" fill="#E8E8E8"/>
  <rect x="361" y="60" width="4" height="13" rx="1" fill="#E8E8E8"/>
  <rect x="367" y="57" width="4" height="16" rx="1" fill="#E8E8E8"/>
  <path d="M379 70 Q383 64 387 70" stroke="#E8E8E8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M376 73 Q383 61 390 73" stroke="#E8E8E8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="383" cy="74" r="1.5" fill="#E8E8E8"/>
  <rect x="396" y="62" width="22" height="12" rx="2" fill="none" stroke="#E8E8E8" stroke-width="1.5"/>
  <rect x="419" y="65" width="2" height="6" rx="1" fill="#E8E8E8"/>
  <rect x="398" y="64" width="16" height="8" rx="1" fill="#E8E8E8"/>

  <!-- Progress Dots: 1/3 -->
  <circle cx="203" cy="110" r="4" fill="#FFD700"/>
  <circle cx="215" cy="110" r="4" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="227" cy="110" r="4" fill="none" stroke="#555555" stroke-width="1.5"/>

  <!-- Title -->
  <text x="215" y="158" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8E8E8" text-anchor="middle">あなたについて</text>
  <text x="215" y="186" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8E8E8" text-anchor="middle">教えてください</text>
  <text x="215" y="213" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">人生グリッドの基準となります</text>

  <!-- Section label: 生年月日 -->
  <text x="40" y="248" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#666666" letter-spacing="0.5">生年月日</text>

  <!-- DatePicker Wheel (simulated) -->
  <!-- Wheel background -->
  <rect x="20" y="255" width="390" height="160" rx="0" fill="#0D0D0D"/>

  <!-- Selection highlight band -->
  <rect x="20" y="308" width="390" height="44" rx="8" fill="#1C1C1E"/>

  <!-- Year column -->
  <!-- faded rows -->
  <text x="102" y="285" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">1988</text>
  <text x="102" y="308" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#777777" text-anchor="middle">1989</text>
  <!-- selected -->
  <text x="102" y="337" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="middle">1990</text>
  <text x="102" y="363" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#777777" text-anchor="middle">1991</text>
  <text x="102" y="390" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">1992</text>

  <!-- Month column -->
  <text x="215" y="285" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">2月</text>
  <text x="215" y="308" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#777777" text-anchor="middle">3月</text>
  <text x="215" y="337" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="middle">4月</text>
  <text x="215" y="363" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#777777" text-anchor="middle">5月</text>
  <text x="215" y="390" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">6月</text>

  <!-- Day column -->
  <text x="328" y="285" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">13日</text>
  <text x="328" y="308" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#777777" text-anchor="middle">14日</text>
  <text x="328" y="337" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="middle">15日</text>
  <text x="328" y="363" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#777777" text-anchor="middle">16日</text>
  <text x="328" y="390" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">17日</text>

  <!-- Top/bottom fade overlay for wheel -->
  <defs>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D0D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D0D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="20" y="255" width="390" height="50" fill="url(#fadeTop)"/>
  <rect x="20" y="365" width="390" height="50" fill="url(#fadeBottom)"/>

  <!-- Divider lines for wheel selection -->
  <line x1="30" y1="308" x2="400" y2="308" stroke="#2C2C2E" stroke-width="1"/>
  <line x1="30" y1="352" x2="400" y2="352" stroke="#2C2C2E" stroke-width="1"/>

  <!-- Section label: 何歳まで生きると思いますか -->
  <text x="40" y="440" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#666666" letter-spacing="0.5">何歳まで生きると思いますか？</text>

  <!-- Life Expectancy Card -->
  <rect x="24" y="452" width="382" height="144" rx="16" fill="#141414"/>

  <!-- Minus button -->
  <!-- Circle outline -->
  <circle cx="88" cy="524" r="26" fill="#1C1C1E"/>
  <text x="88" y="532" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="300" fill="#FFD700" text-anchor="middle">−</text>

  <!-- Life expectancy value -->
  <text x="215" y="541" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle">85歳</text>

  <!-- Plus button -->
  <circle cx="342" cy="524" r="26" fill="#1C1C1E"/>
  <text x="342" y="532" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="300" fill="#FFD700" text-anchor="middle">＋</text>

  <!-- Remaining weeks -->
  <text x="215" y="578" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#FFD700" text-anchor="middle" opacity="0.85">残り 2,860 週</text>

  <!-- Separator line inside card -->
  <line x1="44" y1="596" x2="386" y2="596" stroke="#1C1C1E" stroke-width="1"/>

  <!-- Range hint -->
  <text x="215" y="615" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#444444" text-anchor="middle">60〜120歳の範囲で設定できます</text>

  <!-- CTA Button -->
  <rect x="40" y="758" width="350" height="56" rx="14" fill="#FFD700"/>
  <text x="215" y="793" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="middle">次へ</text>

  <!-- Home Indicator -->
  <rect x="155" y="898" width="120" height="4" rx="2" fill="#3A3A3A"/>

</svg>
