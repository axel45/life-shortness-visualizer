<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820">
  <rect width="1300" height="820" fill="#1C1C1E"/>

  <!-- Title -->
  <text x="650" y="38" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="18" fill="#AEAEB2" text-anchor="middle">壁紙画面（ロック画面） — 全iPhoneサイズ比較</text>

  <!-- Shared patterns -->
  <defs>
    <pattern id="w-past" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3.5" height="3.5" rx="1.75" fill="#48484A"/>
    </pattern>
    <pattern id="w-future" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="2" height="2" rx="1" fill="#3A3A3C"/>
    </pattern>
    <pattern id="w-normal" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3.5" height="3.5" rx="1.75" fill="#AEAEB2"/>
    </pattern>
    <pattern id="w-sunshine" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3.5" height="3.5" rx="1.75" fill="#FFE566"/>
    </pattern>
    <pattern id="w-past-sm" x="0" y="0" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3" height="3" rx="1.5" fill="#48484A"/>
    </pattern>
    <pattern id="w-future-sm" x="0" y="0" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <rect x="1.25" y="1.25" width="1.75" height="1.75" rx="0.875" fill="#3A3A3C"/>
    </pattern>
    <pattern id="w-normal-sm" x="0" y="0" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3" height="3" rx="1.5" fill="#AEAEB2"/>
    </pattern>
    <pattern id="w-sunshine-sm" x="0" y="0" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="3" height="3" rx="1.5" fill="#FFE566"/>
    </pattern>
  </defs>

  <!-- ============================================================ -->
  <!-- iPhone SE (375×667pt → 143×254) Lock screen -->
  <!-- ============================================================ -->
  <g transform="translate(30, 60)">
    <text x="76" y="14" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">iPhone SE</text>
    <text x="76" y="27" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="#636366" text-anchor="middle">375 × 667 pt</text>

    <!-- Phone frame -->
    <rect x="4" y="34" width="144" height="258" rx="18" ry="18" fill="#2C2C2E" stroke="#48484A" stroke-width="1.5"/>
    <!-- Home button -->
    <circle cx="76" cy="284" r="8" fill="none" stroke="#48484A" stroke-width="1.2"/>
    <!-- Screen (black bg = wallpaper bg) -->
    <rect x="9" y="39" width="134" height="240" rx="4" ry="4" fill="#000"/>

    <!-- Lock screen time (large) -->
    <text x="76" y="70" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="28" font-weight="200" fill="#FFFFFF" text-anchor="middle">9:41</text>
    <text x="76" y="83" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">2026年8月10日 月曜日</text>

    <!-- Wallpaper grid (starts at ~y=100 on SE) -->
    <!-- 26 cols × 42 rows at cell 4.5 = 117 × 189 → fits in 134 wide -->
    <g transform="translate(9, 95)">
      <!-- Past unrecorded -->
      <rect x="0" y="0" width="120" height="110" fill="url(#w-past-sm)"/>
      <!-- Past normal -->
      <rect x="0" y="110" width="60" height="27" fill="url(#w-normal-sm)"/>
      <rect x="60" y="110" width="60" height="27" fill="url(#w-past-sm)"/>
      <!-- Sunshine scattered -->
      <rect x="4.5" y="114.5" width="18" height="4.5" fill="url(#w-sunshine-sm)"/>
      <rect x="31.5" y="123" width="13.5" height="4.5" fill="url(#w-sunshine-sm)"/>
      <rect x="67.5" y="118" width="9" height="4.5" fill="url(#w-sunshine-sm)"/>
      <!-- Current week -->
      <rect x="49.5" y="137" width="3" height="3" rx="1.5" fill="#48484A" stroke="#F2F2F7" stroke-width="1"/>
      <!-- Future -->
      <rect x="0" y="141" width="120" height="90" fill="url(#w-future-sm)"/>
    </g>

    <!-- Lock screen bottom -->
    <rect x="9" y="230" width="134" height="9" rx="0" fill="rgba(0,0,0,0.5)"/>
    <!-- Camera / flashlight icons -->
    <circle cx="30" cy="234" r="6" fill="rgba(255,255,255,0.15)"/>
    <circle cx="122" cy="234" r="6" fill="rgba(255,255,255,0.15)"/>
    <text x="76" y="237" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="6" fill="rgba(255,255,255,0.4)" text-anchor="middle">スワイプしてロック解除</text>
  </g>

  <!-- ============================================================ -->
  <!-- iPhone 16 standard (390×844pt → 160×346) Lock screen -->
  <!-- ============================================================ -->
  <g transform="translate(215, 60)">
    <text x="83" y="14" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">iPhone 16</text>
    <text x="83" y="27" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="#636366" text-anchor="middle">390 × 844 pt</text>

    <rect x="4" y="34" width="158" height="348" rx="22" ry="22" fill="#2C2C2E" stroke="#48484A" stroke-width="1.5"/>
    <!-- Dynamic Island -->
    <rect x="56" y="41" width="50" height="10" rx="5" fill="#000"/>
    <rect x="9" y="39" width="148" height="338" rx="16" ry="16" fill="#000"/>

    <!-- Time -->
    <text x="83" y="82" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="36" font-weight="200" fill="#FFFFFF" text-anchor="middle">9:41</text>
    <text x="83" y="97" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">2026年8月10日 月曜日</text>

    <!-- Grid wallpaper -->
    <g transform="translate(11, 108)">
      <rect x="0" y="0" width="132" height="140" fill="url(#w-past)"/>
      <rect x="0" y="140" width="66" height="30" fill="url(#w-normal)"/>
      <rect x="66" y="140" width="66" height="30" fill="url(#w-past)"/>
      <rect x="5" y="145" width="20" height="5" fill="url(#w-sunshine)"/>
      <rect x="35" y="155" width="15" height="5" fill="url(#w-sunshine)"/>
      <rect x="71" y="150" width="10" height="5" fill="url(#w-sunshine)"/>
      <!-- Current week -->
      <rect x="55" y="170" width="3.5" height="3.5" rx="1.75" fill="#48484A" stroke="#F2F2F7" stroke-width="1.2"/>
      <rect x="0" y="175" width="132" height="100" fill="url(#w-future)"/>
    </g>

    <!-- Bottom bar -->
    <rect x="9" y="318" width="148" height="20" rx="0" fill="rgba(0,0,0,0.6)"/>
    <circle cx="30" cy="328" r="8" fill="rgba(255,255,255,0.12)"/>
    <circle cx="136" cy="328" r="8" fill="rgba(255,255,255,0.12)"/>
    <text x="83" y="331" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="middle">スワイプしてロック解除</text>
    <!-- Home indicator -->
    <rect x="9" y="339" width="148" height="10" rx="0" fill="#000"/>
    <rect x="58" y="342" width="50" height="3" rx="1.5" fill="#48484A"/>
  </g>

  <!-- ============================================================ -->
  <!-- iPhone 16 Plus (430×932pt → 176×382) Lock screen -->
  <!-- ============================================================ -->
  <g transform="translate(420, 60)">
    <text x="93" y="14" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">iPhone 16 Plus</text>
    <text x="93" y="27" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="#636366" text-anchor="middle">430 × 932 pt</text>

    <rect x="4" y="34" width="176" height="384" rx="24" ry="24" fill="#2C2C2E" stroke="#48484A" stroke-width="1.5"/>
    <rect x="63" y="41" width="54" height="11" rx="5.5" fill="#000"/>
    <rect x="9" y="39" width="166" height="374" rx="18" ry="18" fill="#000"/>

    <text x="93" y="88" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="40" font-weight="200" fill="#FFFFFF" text-anchor="middle">9:41</text>
    <text x="93" y="105" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">2026年8月10日 月曜日</text>

    <defs>
      <pattern id="w-plus" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4" height="4" rx="2" fill="#48484A"/>
      </pattern>
      <pattern id="w-plus-fut" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="1.5" y="1.5" width="2" height="2" rx="1" fill="#3A3A3C"/>
      </pattern>
      <pattern id="w-plus-norm" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4" height="4" rx="2" fill="#AEAEB2"/>
      </pattern>
      <pattern id="w-plus-sun" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4" height="4" rx="2" fill="#FFE566"/>
      </pattern>
    </defs>

    <g transform="translate(13, 116)">
      <rect x="0" y="0" width="148" height="154" fill="url(#w-plus)"/>
      <rect x="0" y="154" width="74" height="33" fill="url(#w-plus-norm)"/>
      <rect x="74" y="154" width="74" height="33" fill="url(#w-plus)"/>
      <rect x="5.5" y="159.5" width="22" height="5.5" fill="url(#w-plus-sun)"/>
      <rect x="38.5" y="170.5" width="16.5" height="5.5" fill="url(#w-plus-sun)"/>
      <rect x="79" y="165" width="11" height="5.5" fill="url(#w-plus-sun)"/>
      <rect x="62" y="187" width="4" height="4" rx="2" fill="#48484A" stroke="#F2F2F7" stroke-width="1.2"/>
      <rect x="0" y="192" width="148" height="110" fill="url(#w-plus-fut)"/>
    </g>

    <rect x="9" y="350" width="166" height="23" rx="0" fill="rgba(0,0,0,0.6)"/>
    <circle cx="32" cy="361" r="9" fill="rgba(255,255,255,0.12)"/>
    <circle cx="152" cy="361" r="9" fill="rgba(255,255,255,0.12)"/>
    <text x="93" y="364" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.35)" text-anchor="middle">スワイプしてロック解除</text>
    <rect x="9" y="374" width="166" height="13" rx="0" fill="#000"/>
    <rect x="68" y="377" width="48" height="3" rx="1.5" fill="#48484A"/>
  </g>

  <!-- ============================================================ -->
  <!-- iPhone 16 Pro (393×852pt → 160×352) Lock screen -->
  <!-- ============================================================ -->
  <g transform="translate(650, 60)">
    <text x="83" y="14" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">iPhone 16 Pro</text>
    <text x="83" y="27" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="#636366" text-anchor="middle">393 × 852 pt</text>

    <rect x="4" y="34" width="158" height="352" rx="22" ry="22" fill="#2C2C2E" stroke="#636366" stroke-width="2"/>
    <!-- Dynamic Island Pro -->
    <rect x="54" y="42" width="54" height="12" rx="6" fill="#000"/>
    <rect x="9" y="39" width="148" height="342" rx="16" ry="16" fill="#000"/>

    <text x="83" y="86" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="36" font-weight="200" fill="#FFFFFF" text-anchor="middle">9:41</text>
    <text x="83" y="101" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">2026年8月10日 月曜日</text>

    <g transform="translate(11, 112)">
      <rect x="0" y="0" width="132" height="144" fill="url(#w-past)"/>
      <rect x="0" y="144" width="66" height="30" fill="url(#w-normal)"/>
      <rect x="66" y="144" width="66" height="30" fill="url(#w-past)"/>
      <rect x="5" y="149" width="20" height="5" fill="url(#w-sunshine)"/>
      <rect x="35" y="159" width="15" height="5" fill="url(#w-sunshine)"/>
      <rect x="71" y="154" width="10" height="5" fill="url(#w-sunshine)"/>
      <rect x="55" y="174" width="3.5" height="3.5" rx="1.75" fill="#48484A" stroke="#F2F2F7" stroke-width="1.2"/>
      <rect x="0" y="179" width="132" height="100" fill="url(#w-future)"/>
    </g>

    <rect x="9" y="320" width="148" height="22" rx="0" fill="rgba(0,0,0,0.6)"/>
    <circle cx="29" cy="331" r="8" fill="rgba(255,255,255,0.12)"/>
    <circle cx="135" cy="331" r="8" fill="rgba(255,255,255,0.12)"/>
    <text x="83" y="334" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="middle">スワイプしてロック解除</text>
    <rect x="9" y="342" width="148" height="10" rx="0" fill="#000"/>
    <rect x="58" y="345" width="50" height="3" rx="1.5" fill="#48484A"/>
  </g>

  <!-- ============================================================ -->
  <!-- iPhone 16 Pro Max (430×932pt → 176×384) Lock screen -->
  <!-- ============================================================ -->
  <g transform="translate(870, 60)">
    <text x="93" y="14" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">iPhone 16 Pro Max</text>
    <text x="93" y="27" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="#636366" text-anchor="middle">430 × 932 pt</text>

    <rect x="4" y="34" width="176" height="384" rx="24" ry="24" fill="#2C2C2E" stroke="#636366" stroke-width="2"/>
    <!-- Dynamic Island Pro Max -->
    <rect x="61" y="42" width="58" height="12" rx="6" fill="#000"/>
    <rect x="9" y="39" width="166" height="374" rx="18" ry="18" fill="#000"/>

    <text x="93" y="90" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="40" font-weight="200" fill="#FFFFFF" text-anchor="middle">9:41</text>
    <text x="93" y="107" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">2026年8月10日 月曜日</text>

    <defs>
      <pattern id="w-pm-past" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4" height="4" rx="2" fill="#48484A"/>
      </pattern>
      <pattern id="w-pm-fut" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="1.5" y="1.5" width="2" height="2" rx="1" fill="#3A3A3C"/>
      </pattern>
      <pattern id="w-pm-norm" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4" height="4" rx="2" fill="#AEAEB2"/>
      </pattern>
      <pattern id="w-pm-sun" x="0" y="0" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4" height="4" rx="2" fill="#FFE566"/>
      </pattern>
    </defs>

    <g transform="translate(13, 118)">
      <rect x="0" y="0" width="148" height="154" fill="url(#w-pm-past)"/>
      <rect x="0" y="154" width="74" height="33" fill="url(#w-pm-norm)"/>
      <rect x="74" y="154" width="74" height="33" fill="url(#w-pm-past)"/>
      <rect x="5.5" y="159.5" width="22" height="5.5" fill="url(#w-pm-sun)"/>
      <rect x="38.5" y="170.5" width="16.5" height="5.5" fill="url(#w-pm-sun)"/>
      <rect x="79" y="165" width="11" height="5.5" fill="url(#w-pm-sun)"/>
      <rect x="62" y="187" width="4" height="4" rx="2" fill="#48484A" stroke="#F2F2F7" stroke-width="1.2"/>
      <rect x="0" y="192" width="148" height="110" fill="url(#w-pm-fut)"/>
    </g>

    <rect x="9" y="350" width="166" height="23" rx="0" fill="rgba(0,0,0,0.6)"/>
    <circle cx="32" cy="361" r="9" fill="rgba(255,255,255,0.12)"/>
    <circle cx="152" cy="361" r="9" fill="rgba(255,255,255,0.12)"/>
    <text x="93" y="364" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.35)" text-anchor="middle">スワイプしてロック解除</text>
    <rect x="9" y="374" width="166" height="13" rx="0" fill="#000"/>
    <rect x="68" y="377" width="48" height="3" rx="1.5" fill="#48484A"/>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 755)">
    <text x="0" y="12" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="12" fill="#636366">壁紙はロック画面全体を覆う（ナビゲーションバー・タブバーなし）。グリッドは時計の下から開始。サイズが大きいほど一度に表示される行数が増加。</text>
    <text x="0" y="30" font-family="SF Pro, Helvetica Neue, sans-serif" font-size="11" fill="#48484A">Dynamic Island: 16 / Plus / Pro / Pro Max（ホームボタンなし）　|　ホームボタン: SE のみ</text>
  </g>
</svg>
